<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ყოველთვიური წიგნი · The Trading Paper</title>
<script src="js/theme.js?v=1"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  :root { --gold:#8b6914; }
  .lg-wrap { max-width: 900px; margin: 0 auto; padding: 10px 18px 40px; }

  .lg-hero { text-align:center; border:2px solid var(--rule); background:var(--paper);
             padding:18px 14px; margin:16px 0 8px; }
  .lg-hero .eyebrow { font-family:'Noto Sans Georgian',sans-serif; font-size:10px;
             letter-spacing:2.5px; text-transform:uppercase; color:var(--muted); }
  .lg-hero .big { font-family:'Noto Serif Georgian',serif; font-weight:900; font-size:50px;
             line-height:1.05; color:var(--green); margin:2px 0; }
  .lg-hero.over { border-color:var(--red); } .lg-hero.over .big { color:var(--red); }
  .lg-hero .sub { font-size:13px; color:var(--muted); font-style:italic; }

  .lg-bar { display:flex; height:22px; border:1px solid var(--rule); overflow:hidden; margin-top:14px; }
  .lg-bar div { transition:width .35s ease; }
  @media (prefers-reduced-motion:reduce){ .lg-bar div{ transition:none; } }
  .lg-legend { display:flex; flex-wrap:wrap; gap:6px 16px; margin:8px 0 4px;
               font-family:'Noto Sans Georgian',sans-serif; font-size:11.5px; }
  .lg-legend i { width:11px; height:11px; display:inline-block; margin-right:6px; vertical-align:-1px; }

  /* toolbar: autosave status + reset */
  .lg-toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px;
                flex-wrap:wrap; margin:8px 0 2px; }
  #num-saved { font-family:'Noto Sans Georgian',sans-serif; font-size:10.5px; letter-spacing:.5px;
               color:var(--muted); min-height:14px; transition:color .2s; }
  #num-saved.flash { color:var(--green); font-weight:700; }
  .lg-reset { font-family:'Noto Sans Georgian',sans-serif; font-size:11px; letter-spacing:.5px;
              color:var(--muted); background:transparent; border:1px solid var(--border);
              border-radius:5px; padding:6px 12px; cursor:pointer; }
  .lg-reset:hover { border-color:var(--red); color:var(--red); }

  .lg-cols { display:flex; gap:28px; align-items:flex-start; margin-top:6px; }
  @media (max-width:720px){ .lg-cols{ flex-direction:column; gap:0; } }
  .lg-col { flex:1; min-width:0; width:100%; }

  .lg-sect { margin:22px 0 12px; }
  .lg-sect .n { font-family:ui-monospace,monospace; font-size:11px; color:var(--red); font-weight:700; margin-right:8px; }
  .lg-sect h3 { display:inline; font-family:'Noto Serif Georgian',serif; font-size:17px; }
  .lg-sect hr { border:none; border-top:1px solid var(--border); margin-top:8px; }
  .lg-field { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; position: relative; }
  .lg-field .editable-name {
    flex: 1;
    border: 1px solid transparent;
    background: transparent;
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    padding: 6px 8px;
    border-radius: 4px;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
    box-sizing: border-box;
  }
  .lg-field .editable-name:focus,
  .lg-field .editable-name:hover {
    border-color: var(--border);
    background: #fbfaf5;
  }
  .lg-field .lg-in { flex: 0 0 160px; margin-top: 0; border: 1px solid var(--border); background: #fbfaf5; display: flex; align-items: stretch; }
  .lg-in button { width: 30px; border: none; background: transparent; color: var(--ink); font-size: 16px; cursor: pointer; line-height: 1; }
  .lg-in .box { flex: 1; display: flex; align-items: center; padding: 0 6px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .lg-in .box span { font-family: ui-monospace, monospace; color: var(--muted); font-size: 13px; }
  .lg-in input { width: 100%; border: none; outline: none; background: transparent; font-family: ui-monospace, monospace; font-size: 14px; color: var(--ink); padding: 6px 2px; text-align: right; -moz-appearance: textfield; }
  .lg-in input::-webkit-inner-spin-button, .lg-in input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .lg-field .del-item-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 6px;
    line-height: 1;
    transition: color 0.15s;
  }
  .lg-field .del-item-btn:hover {
    color: var(--red);
  }
  
  .add-item-btn {
    display: inline-flex;
    align-items: center;
    background: none;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 4px;
    margin-bottom: 24px;
    transition: all 0.15s ease;
  }
  .add-item-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
    background: rgba(0,0,0,0.02);
  }

  /* Dynamic groups styling */
  .group-block {
    margin-bottom: 28px;
    border: 1px solid transparent;
  }
  .lg-sect-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 22px 0 4px;
    position: relative;
  }
  .lg-sect-header .n {
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: var(--red);
    font-weight: 700;
  }
  .lg-sect-header .editable-group-name {
    font-family: 'Noto Serif Georgian', serif;
    font-weight: 700;
    font-size: 17px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    padding: 3px 6px;
    border-radius: 4px;
    transition: all 0.15s ease;
    flex: 1;
    box-sizing: border-box;
  }
  .lg-sect-header .editable-group-name:focus,
  .lg-sect-header .editable-group-name:hover {
    border-color: var(--border);
    background: #fbfaf5;
  }
  .lg-sect-header .del-group-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 0 6px;
    transition: color 0.15s;
  }
  .lg-sect-header .del-group-btn:hover {
    color: var(--red);
  }
  .lg-sect-note-row {
    margin-bottom: 8px;
    padding-left: 20px;
  }
  .lg-sect-note-row .editable-group-note {
    font-family: 'Noto Sans Georgian', sans-serif;
    font-style: italic;
    font-size: 12.5px;
    color: var(--muted);
    border: 1px solid transparent;
    background: transparent;
    padding: 2px 6px;
    border-radius: 4px;
    width: 90%;
    box-sizing: border-box;
    transition: all 0.15s ease;
  }
  .lg-sect-note-row .editable-group-note:focus,
  .lg-sect-note-row .editable-group-note:hover {
    border-color: var(--border);
    background: #fbfaf5;
  }

  .add-group-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 2px dashed var(--border);
    color: var(--muted);
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 10px;
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 14px;
    margin-bottom: 24px;
    transition: all 0.15s ease;
  }
  .add-group-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
    background: rgba(0,0,0,0.02);
  }

  /* Toolbar controls & currency picker */
  .lg-toolbar-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .lg-currency-picker {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 11px;
    color: var(--muted);
  }
  .lg-currency-picker select {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
  }

  .lg-line { display:flex; justify-content:space-between; align-items:baseline;
             padding:7px 0; border-bottom:1px dotted var(--border); font-size:14px; }
  .lg-line b { font-family:ui-monospace,monospace; font-size:15px; font-weight:600; }
  .lg-subtotal { display:flex; justify-content:space-between; padding:5px 0 9px; }
  .lg-subtotal em { font-size:12.5px; color:var(--muted); }
  .lg-subtotal b { font-family:ui-monospace,monospace; font-size:14px; }

  .lg-total { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px;
              padding:12px; background:#eef3ef; border:1.5px solid var(--green); }
  .lg-total.over { background:#fbebeb; border-color:var(--red); }
  .lg-total b { font-family:ui-monospace,monospace; font-size:20px; font-weight:700; color:var(--green); }
  .lg-total.over b { color:var(--red); }

  .lg-foot { text-align:center; font-style:italic; font-size:11.5px; color:var(--muted);
             border-top:1px solid var(--rule); margin-top:26px; padding-top:8px; }rgin-top:26px; padding-top:8px; }
</style>
</head>
<body>

<header class="masthead">
  <div class="top-bar">
    <span id="today-date"></span>
    <span><a href="index.html" style="text-decoration:none;border:1px solid var(--rule);padding:1px 8px;border-radius:3px;font-size:11px;">← ჩემი კაბინეტი</a></span>
  </div>
  <h1>ყოველთვიური წიგნი</h1>
  <p class="tagline">ბიუჯეტი · ხელფასი · ცხოვრება</p>
</header>

<main class="lg-wrap">

  <div class="lg-hero" id="hero">
    <div class="eyebrow" id="hero-label">თავისუფალი დასახარჯი</div>
    <div class="big" id="hero-num">€0</div>
    <div class="sub">თვეში · ცხოვრება და მომავალი უკვე გადახდილია</div>
    <div class="lg-bar" id="bar" aria-hidden="true"></div>
    <div class="lg-legend" id="legend"></div>
  </div>

  <!-- autosave status + reset -->
  <div class="lg-toolbar">
    <div id="num-saved">● ცვლილებები ავტომატურად ინახება ამ ბრაუზერში</div>
    <div class="lg-toolbar-controls">
      <div class="lg-currency-picker">
        <label for="currency-select">ვალუტა: </label>
        <select id="currency-select" onchange="changeCurrency(this.value)">
          <option value="₾">₾ GEL</option>
          <option value="$">$ USD</option>
          <option value="€">€ EUR</option>
          <option value="£">£ GBP</option>
        </select>
      </div>
      <button type="button" id="lg-reset" class="lg-reset">↺ საწყის მაჩვენებლებზე დაბრუნება</button>
    </div>
  </div>

  <div class="lg-cols">
    <div class="lg-col">
      <div id="groups-container"></div>
      <button type="button" class="add-group-btn" onclick="addNewGroup()">+ ახალი კატეგორიის დამატება</button>
    </div>

    <div class="lg-col">
      <!-- Will be populated dynamically via JavaScript -->
    </div>
  </div>

  <div class="lg-foot">© The Trading Paper · ვისბადენი · ეს არ არის ფინანსური რჩევა</div>
</main>

<script>
(function(){
  "use strict";

  var DEFAULT_GROUPS = [
    { id: 'income', name: 'თვიური შემოსავალი', note: 'შემოსავლის წყაროები', role: 'income', color: '#8b6914' },
    { id: 'fixed', name: 'ფიქსირებული ხარჯები', note: 'სახურავი და საბაზისო — ყოველთვე ერთი და იგივე', role: 'expense', color: '#3a3630' },
    { id: 'future', name: 'მომავალი', note: 'ხელფასის დღეს — პირველ რიგში, ავტომატურად', role: 'expense', color: '#166534' },
    { id: 'life', name: 'ჩემი ცხოვრება', note: 'ის, რისთვისაც ღირს', role: 'expense', color: '#b91c1c' }
  ];

  var DEFAULT_ITEMS = [
    { id: '1', groupId: 'income', name: 'თვიური შემოსავალი', value: 1765, step: 50, legacyKey: 'income' },
    { id: '2', groupId: 'fixed', name: 'ქირა (თბილი)', value: 550, step: 25, legacyKey: 'rent' },
    { id: '3', groupId: 'fixed', name: 'საკვები', value: 300, step: 25, legacyKey: 'groceries' },
    { id: '4', groupId: 'fixed', name: 'ტელეფონი + ინტერნეტი', value: 35, step: 5, legacyKey: 'phone' },
    { id: '5', groupId: 'fixed', name: 'დენი', value: 40, step: 5, legacyKey: 'power' },
    { id: '6', groupId: 'fixed', name: 'Rundfunkbeitrag', value: 18, step: 1, legacyKey: 'rundfunk' },
    { id: '7', groupId: 'fixed', name: 'Deutschlandticket', value: 58, step: 1, legacyKey: 'ticket' },
    { id: '8', groupId: 'future', name: 'ინვესტიცია (DCA)', value: 200, step: 25, legacyKey: 'invest' },
    { id: '9', groupId: 'future', name: 'ბუფერი', value: 200, step: 25, legacyKey: 'buffer' },
    { id: '10', groupId: 'life', name: 'საბრძოლო კლუბი (MMA)', value: 70, step: 5, legacyKey: 'mma' },
    { id: '11', groupId: 'life', name: 'დარბაზი', value: 30, step: 5, legacyKey: 'gym' },
    { id: '12', groupId: 'life', name: 'წიგნები / სწავლა', value: 40, step: 5, legacyKey: 'books' },
    { id: '13', groupId: 'life', name: 'გასვლები ბუნებაში', value: 30, step: 5, legacyKey: 'trips' }
  ];

  var state = { currency: '€', groups: [], items: [] };
  
  // Load state and handle legacy data migration
  try {
    var raw = localStorage.getItem("tp_ledger");
    if (raw) {
      var parsed = JSON.parse(raw);
      state.currency = parsed.currency || '€';
      if (parsed.groups && Array.isArray(parsed.groups)) {
        state.groups = parsed.groups;
      } else {
        state.groups = JSON.parse(JSON.stringify(DEFAULT_GROUPS));
      }
      
      if (parsed.items && Array.isArray(parsed.items)) {
        state.items = parsed.items.map(function(item) {
          if (item.group && !item.groupId) {
            item.groupId = item.group;
            delete item.group;
          }
          return item;
        });
      } else {
        state.items = DEFAULT_ITEMS.map(function(item) {
          var copy = { id: item.id, groupId: item.groupId, name: item.name, value: item.value, step: item.step };
          if (parsed[item.legacyKey] !== undefined) {
            copy.value = Number(parsed[item.legacyKey]) || 0;
          }
          return copy;
        });
      }
    } else {
      state.currency = '€';
      state.groups = JSON.parse(JSON.stringify(DEFAULT_GROUPS));
      state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    }
  } catch(e) {
    state.currency = '€';
    state.groups = JSON.parse(JSON.stringify(DEFAULT_GROUPS));
    state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  }

  var ready = false;                 // don't flash "saved" during the first render
  var savedNum = document.getElementById("num-saved");
  var savedTimer = null;
  
  function flashSaved(){
    if(!ready || !savedNum) return;
    var n = new Date();
    savedNum.textContent = "✓ შენახულია · " + String(n.getHours()).padStart(2,"0") + ":" + String(n.getMinutes()).padStart(2,"0");
    savedNum.classList.add("flash");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function(){
      savedNum.textContent = "● ცვლილებები ავტომატურად ინახება ამ ბრაუზერში";
      savedNum.classList.remove("flash");
    }, 1800);
  }

  function save(){ try{ localStorage.setItem("tp_ledger", JSON.stringify(state)); }catch(e){} flashSaved(); }
  function fmt(n){ return (state.currency || '€') + Math.round(n).toLocaleString("de-DE"); }
  
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  window.addNewGroup = function() {
    var newId = 'group-' + Date.now();
    // Choose a color that doesn't overlap too much
    var colors = ['#0f3057', '#dc2626', '#166534', '#b91c1c', '#3a3630', '#8b6914', '#0891b2', '#2563eb', '#9d174d'];
    var col = colors[state.groups.length % colors.length];
    
    state.groups.push({
      id: newId,
      name: 'ახალი კატეგორია',
      note: 'აღწერა…',
      role: 'expense',
      color: col
    });
    save();
    render();
  };

  window.deleteGroup = function(id) {
    var group = state.groups.find(function(g) { return g.id === id; });
    if (!group) return;
    if (group.role === 'income') {
      alert('შემოსავლის კატეგორიის წაშლა შეუძლებელია!');
      return;
    }
    if (!confirm('ნამდვილად გსურთ წაშალოთ კატეგორია "' + group.name + '" და ყველა მასში შემავალი ხაზი?')) return;
    
    state.groups = state.groups.filter(function(g) { return g.id !== id; });
    state.items = state.items.filter(function(it) { return it.groupId !== id; });
    
    save();
    render();
  };

  window.updateGroupName = function(id, val) {
    state.groups.forEach(function(g) {
      if (g.id === id) {
        g.name = val.trim() || 'კატეგორია';
      }
    });
    save();
    recalc();
  };

  window.updateGroupNote = function(id, val) {
    state.groups.forEach(function(g) {
      if (g.id === id) {
        g.note = val.trim();
      }
    });
    save();
  };

  window.addNewItem = function(groupId) {
    var defaultSteps = {
      income: 50,
      fixed: 25,
      future: 25,
      life: 5
    };
    var newItem = {
      id: 'item-' + Date.now() + '-' + Math.floor(Math.random()*1000),
      groupId: groupId,
      name: 'ახალი ხარჯი',
      value: 0,
      step: defaultSteps[groupId] || 10
    };
    state.items.push(newItem);
    save();
    render();
  };

  window.deleteItem = function(id) {
    if (!confirm('ნამდვილად გსურთ ამ ხაზის წაშლა?')) return;
    state.items = state.items.filter(function(it) { return it.id !== id; });
    save();
    render();
  };

  window.updateItemName = function(id, val) {
    state.items.forEach(function(it) {
      if (it.id === id) {
        it.name = val.trim() || 'უსათაურო';
      }
    });
    save();
  };

  window.updateItemValue = function(id, val) {
    state.items.forEach(function(it) {
      if (it.id === id) {
        it.value = Math.max(0, Number(val) || 0);
      }
    });
    save();
    recalc();
  };

  window.adjustValue = function(id, direction) {
    state.items.forEach(function(it) {
      if (it.id === id) {
        var step = it.step || 10;
        it.value = Math.max(0, it.value + (direction * step));
        var row = document.querySelector('.lg-field[data-id="' + id + '"]');
        if (row) {
          var inp = row.querySelector('.lg-in input');
          if (inp) inp.value = it.value;
        }
      }
    });
    save();
    recalc();
  };

  window.changeCurrency = function(val) {
    state.currency = val;
    save();
    render();
  };

  function render() {
    var container = document.getElementById('groups-container');
    if (!container) return;
    
    container.innerHTML = state.groups.map(function(g, index) {
      var numLabel = g.role === 'income' ? '✎' : (index).toString();
      var isIncome = g.role === 'income';
      var delBtn = isIncome ? '' : '<button type="button" class="del-group-btn" onclick="deleteGroup(\'' + g.id + '\')" title="კატეგორიის წაშლა">×</button>';
      
      var groupItems = state.items.filter(function(it) { return it.groupId === g.id; });
      
      var itemsHtml = groupItems.map(function(it) {
        return '<div class="lg-field" data-id="' + it.id + '">'
          + '<input type="text" class="editable-name" value="' + esc(it.name) + '" onchange="updateItemName(\'' + it.id + '\', this.value)" placeholder="დასახელება">'
          + '<div class="lg-in">'
          +   '<button type="button" onclick="adjustValue(\'' + it.id + '\', -1)">−</button>'
          +   '<div class="box"><span>' + state.currency + '</span><input type="number" value="' + it.value + '" onchange="updateItemValue(\'' + it.id + '\', this.value)"></div>'
          +   '<button type="button" onclick="adjustValue(\'' + it.id + '\', 1)">+</button>'
          + '</div>'
          + '<button type="button" class="del-item-btn" onclick="deleteItem(\'' + it.id + '\')" title="წაშლა">×</button>'
          + '</div>';
      }).join('');
      
      return '<div class="group-block" data-group-id="' + g.id + '">'
        + '<div class="lg-sect-header">'
        +   '<span class="n">' + numLabel + '</span>'
        +   '<input type="text" class="editable-group-name" value="' + esc(g.name) + '" onchange="updateGroupName(\'' + g.id + '\', this.value)" placeholder="კატეგორია">'
        +   delBtn
        + '</div>'
        + '<div class="lg-sect-note-row">'
        +   '<input type="text" class="editable-group-note" value="' + esc(g.note) + '" onchange="updateGroupNote(\'' + g.id + '\', this.value)" placeholder="კატეგორიის აღწერა…">'
        + '</div>'
        + '<hr style="border:none; border-top:1px solid var(--border); margin-top:2px; margin-bottom:12px;">'
        + '<div class="group-items-list">' + itemsHtml + '</div>'
        + '<button type="button" class="add-item-btn" onclick="addNewItem(\'' + g.id + '\')">+ ხაზის დამატება</button>'
        + '</div>';
    }).join('');
    
    // Set active currency select option
    var currencySelect = document.getElementById('currency-select');
    if (currencySelect) currencySelect.value = state.currency;
    
    recalc();
  }

  function recalc(){
    if (state.groups.length === 0) return;
    
    var incomeGroup = state.groups[0];
    var incomeSum = 0;
    
    state.items.forEach(function(it) {
      if (it.groupId === incomeGroup.id) {
        incomeSum += Number(it.value) || 0;
      }
    });
    
    var expenseGroups = state.groups.slice(1);
    var groupSums = {};
    var totalExpenses = 0;
    
    expenseGroups.forEach(function(g) {
      var sum = 0;
      state.items.forEach(function(it) {
        if (it.groupId === g.id) {
          sum += Number(it.value) || 0;
        }
      });
      groupSums[g.id] = sum;
      totalExpenses += sum;
    });
    
    var free = incomeSum - totalExpenses;
    var over = free < 0;

    var resultsCol = document.querySelector('.lg-cols > .lg-col:last-child');
    if (resultsCol) {
      var linesHtml = '';
      var runningRemaining = incomeSum;
      
      linesHtml += '<div class="lg-line"><span>' + esc(incomeGroup.name) + '</span><b id="r-inc">' + fmt(incomeSum) + '</b></div>';
      
      expenseGroups.forEach(function(g) {
        var sum = groupSums[g.id] || 0;
        runningRemaining -= sum;
        linesHtml += '<div class="lg-line"><span>− ' + esc(g.name) + '</span><b style="color:' + g.color + ';">−' + fmt(sum) + '</b></div>';
        linesHtml += '<div class="lg-subtotal"><em>' + esc(g.name) + '-ის შემდეგ</em><b>' + fmt(runningRemaining) + '</b></div>';
      });
      
      resultsCol.innerHTML = '<div class="lg-sect"><span class="n">§</span><h3>შედეგი</h3>'
        + '<div class="note">შემოსავალი — ზემოდან ქვემოთ</div><hr></div>'
        + linesHtml
        + '<div class="lg-total ' + (over ? 'over' : '') + '" id="total-box">'
        + '  <span style="font-weight:700;font-size:15px;">= თავისუფალი დასახარჯი</span>'
        + '  <b id="r-free">' + fmt(free) + '</b>'
        + '</div>';
    }
    
    var heroNum = document.getElementById("hero-num");
    var heroLabel = document.getElementById("hero-label");
    var hero = document.getElementById("hero");
    
    if (heroNum) {
      heroNum.textContent = fmt(free);
      heroNum.style.color = over ? "var(--red)" : "var(--green)";
    }
    if (heroLabel) heroLabel.textContent = over ? "ბიუჯეტს გადააჭარბე — შეამცირე" : "თავისუფალი დასახარჯი";
    if (hero) hero.classList.toggle("over", over);

    // Update bar percentage and legends
    var bar = document.getElementById("bar"), leg = document.getElementById("legend");
    if (bar && leg) {
      bar.innerHTML = ""; leg.innerHTML = "";
      
      var sums = [incomeSum];
      var colors = [incomeGroup.color];
      var labels = [incomeGroup.name];
      
      expenseGroups.forEach(function(g) {
        sums.push(groupSums[g.id] || 0);
        colors.push(g.color);
        labels.push(g.name);
      });
      
      sums.push(Math.max(0, free));
      colors.push("#8b6914");
      labels.push("თავისუფალი");
      
      labels.forEach(function(label, i) {
        var pct = incomeSum > 0 ? Math.max(0, (i === 0 ? incomeSum : sums[i]) / incomeSum * 100) : 0;
        if (i > 0) {
          var d = document.createElement("div");
          d.style.width = pct + "%"; d.style.background = colors[i];
          bar.appendChild(d);
        }
        
        var l = document.createElement("span");
        l.innerHTML = '<i style="background:' + colors[i] + '"></i>' + label + " " + Math.round(pct) + "%";
        leg.appendChild(l);
      });
    }
    save();
  }

  // Reset to defaults with double confirmation and timer
  var resetBtn = document.getElementById("lg-reset");
  var resetConfirmState = false;
  var resetTimer = null;
  
  if (resetBtn) {
    resetBtn.style.transition = "all 0.2s ease";
    
    resetBtn.addEventListener("click", function(){
      if (!resetConfirmState) {
        resetConfirmState = true;
        resetBtn.textContent = "⚠️ ნამდვილად გსურთ განულება? (კლიკი დასადასტურებლად)";
        resetBtn.style.borderColor = "var(--red)";
        resetBtn.style.color = "var(--red)";
        resetBtn.style.fontWeight = "bold";
        
        clearTimeout(resetTimer);
        resetTimer = setTimeout(function(){
          revertResetBtn();
        }, 5000);
      } else {
        clearTimeout(resetTimer);
        revertResetBtn();
        
        state.currency = '€';
        state.groups = JSON.parse(JSON.stringify(DEFAULT_GROUPS));
        state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
        save();
        
        render();
        flashSaved();
      }
    });
  }
  
  function revertResetBtn() {
    resetConfirmState = false;
    if (resetBtn) {
      resetBtn.textContent = "↺ საწყის მაჩვენებლებზე დაბრუნება";
      resetBtn.style.borderColor = "var(--border)";
      resetBtn.style.color = "var(--muted)";
      resetBtn.style.fontWeight = "normal";
    }
  }

  // Date in top bar
  var d = new Date();
  var el = document.getElementById("today-date");
  if (el) el.textContent = d.toLocaleDateString("ka-GE", { day:"numeric", month:"long", year:"numeric" });

  render();
  ready = true;
})();
</script>
<script src="js/i18n.js"></script>
<script src="js/masthead.js?v=7"></script>
<script src="/js/clocks.js?v=1"></script>
</body>
