<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გვერდი ვერ მოიძებნა · The Trading Paper</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/js/theme.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;900&family=Noto+Sans+Georgian:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f1ea;--paper:#fffdf7;--ink:#1a1a1a;--muted:#6b6b6b;--border:#d9d4c8;--rule:#1a1a1a;--red:#b91c1c}
  [data-theme="dark"]{--bg:#121315;--paper:#1a1c20;--ink:#e6e8ec;--muted:#9ea4b0;--border:#2d3139;--rule:#404652;--red:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--bg);color:var(--ink);font-family:'Noto Serif Georgian',Georgia,serif}
  .card{max-width:520px;width:100%;background:var(--paper);border:1px solid var(--border);border-top:3px double var(--rule);
    border-bottom:3px double var(--rule);padding:38px 30px;text-align:center}
  .brand{font-weight:900;font-size:22px;text-decoration:none;color:inherit}
  .code{font-size:84px;font-weight:900;line-height:1;margin:22px 0 6px;color:var(--red)}
  h1{font-size:24px;margin:0 0 10px}
  p{font-family:'Noto Sans Georgian',sans-serif;font-size:14.5px;line-height:1.7;color:var(--muted);margin:0 0 24px}
  nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  nav a{font-family:'Noto Sans Georgian',sans-serif;font-size:13.5px;font-weight:700;text-decoration:none;padding:10px 16px;border:2px solid var(--ink);color:var(--ink)}
  nav a.main{background:var(--ink);color:var(--paper)}
  nav a:hover{border-color:var(--red);color:var(--red)} nav a.main:hover{background:var(--red);color:#fff}
  .disc{font-family:'Noto Sans Georgian',sans-serif;font-size:11.5px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="/">The Trading Paper</a>
  <div class="code">404</div>
  <h1>ეს გვერდი ვერ მოიძებნა</h1>
  <p>შესაძლოა ბმული მოძველდა ან გვერდი გადავიტანეთ. ყველა გამოცემა მთავარ გვერდზეა.</p>
  <nav>
    <a class="main" href="/">მთავარი →</a>
    <a href="/#archive">არქივი</a>
    <a href="/meportfolio/">ბაზარი</a>
  </nav>
  <div class="disc">ეს არ არის ფინანსური რჩევა</div>
</main>
</body>
</html>
