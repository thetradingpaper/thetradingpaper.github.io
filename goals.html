<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>მიზნები · The Trading Paper</title>
<meta name="description" content="ჩემი კაბინეტი — მიზნები.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b91c1c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f1ea'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='22' font-weight='900' text-anchor='middle' fill='%23b91c1c'%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/enhance.css?v=20260710a">
<script>(function(){try{if(localStorage.getItem('tp_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<style>
  .cab-lead{font-family:'Noto Sans Georgian',sans-serif;font-size:13px;color:var(--muted);margin:8px 0 18px;line-height:1.6;}
  .cab-sec{border-top:2px solid var(--rule);border-bottom:1px solid var(--border);padding:6px 0;margin:22px 0 14px;display:flex;justify-content:space-between;align-items:baseline;}
  .cab-sec .t{font-family:'Noto Sans Georgian',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--ink);}
  .cab-sec .c{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);}
  .goal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(max-width:640px){.goal-grid{grid-template-columns:1fr;}}
  .goal{background:var(--paper);border:1px solid var(--border);border-top:2px solid var(--ink);padding:14px 16px;font-family:'Noto Sans Georgian',sans-serif;}
  .goal.done{opacity:.62;border-top-color:var(--green,#15803d);}
  .goal .g-title{font-family:'Noto Serif Georgian',serif;font-weight:900;font-size:17px;color:var(--ink);line-height:1.2;}
  .goal .g-detail{font-size:11.5px;color:var(--muted);margin:4px 0 10px;line-height:1.5;}
  .goal .g-bar{height:8px;background:rgba(0,0,0,.06);border-radius:5px;overflow:hidden;}
  .goal .g-fill{height:100%;background:var(--red,#b91c1c);border-radius:5px;transition:width .3s;}
  .goal.done .g-fill{background:var(--green,#15803d);}
  .goal .g-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;font-size:10px;color:var(--muted);letter-spacing:.5px;}
  .goal .g-pct{font-family:ui-monospace,monospace;font-weight:700;color:var(--ink);font-size:12px;}
  .cab-empty{font-family:'Noto Sans Georgian',sans-serif;font-size:12px;color:var(--muted);padding:16px;text-align:center;border:1px dashed var(--border);}
  .cab-form{background:var(--paper);border:1px solid var(--border);border-left:3px solid var(--accent,#8b6914);margin:22px 0;overflow:hidden;}
  .cab-form>summary{cursor:pointer;list-style:none;padding:12px 18px;font-family:'Noto Sans Georgian',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);}
  .cab-form>summary::-webkit-details-marker{display:none;}
  .cab-form>summary::after{content:'+';float:right;color:var(--red);font-size:18px;line-height:1;}
  .cab-form[open]>summary::after{content:'−';}
  .cab-form .fb{padding:6px 18px 18px;border-top:1px solid var(--border);}
  .cab-form label{display:block;font-family:'Noto Sans Georgian',sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;}
  .cab-form input,.cab-form textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:13px;background:var(--bg,#fffdf7);color:var(--ink);}
  .cab-form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.cab-form .row{grid-template-columns:1fr;}}
  .cab-form .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--ink);}
  .cab-form .chk input{width:auto;}
  .cab-btn{margin-top:14px;padding:9px 22px;background:#1a1a1a;color:#fff;border:none;font-size:12px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;font-family:sans-serif;border-radius:4px;}
  .cab-form select {width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:13px;background:var(--bg,#fffdf7);color:var(--ink);margin-top:2px;}
  .goal { position: relative; }
  .goal .goal-del-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }
  .goal .goal-del-btn:hover {
    color: var(--red);
    background: rgba(185, 28, 28, 0.08);
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>მიზნები</h1>
  <p class="tagline">ჩემი კაბინეტი · სად მივდივარ</p>
</header>

<main class="container">
  <p class="cab-lead">ხედვა და კონკრეტული მიზნები. ყოველი დიდი შედეგი ყოველდღიური ჩვევის ჯამია — აქ ვინახავ იმას, რისკენაც მივდივარ და რამდენად ახლოს ვარ.</p>

  <div class="cab-sec"><span class="t">აქტიური მიზნები</span><span class="c" id="goal-count"></span></div>
  <div class="goal-grid" id="goal-grid"></div>

  <details class="cab-form">
    <summary>ახალი მიზნის დამატება</summary>
    <div class="fb">
      <label>სათაური</label>
      <input id="f-title" type="text" placeholder="მაგ. სახლის ყიდვა" required>
      
      <label>დეტალი</label>
      <input id="f-detail" type="text" placeholder="მოკლე აღწერა / წიგნი / შენიშვნა">
      
      <div class="row">
        <div>
          <label>სამიზნე თანხა ($)</label>
          <input id="f-target" type="number" placeholder="მაგ. 1000000" min="1" required>
        </div>
        <div>
          <label>ვადა (YYYY-MM-DD)</label>
          <input id="f-deadline" type="date">
        </div>
      </div>
      
      <div class="row">
        <div>
          <label>მიბმული პორტფელი</label>
          <select id="f-portfolio" onchange="toggleManualProgress()">
            <option value="none">არცერთი (მექანიკური პროგრესი)</option>
            <option value="bog">BOG (DOGMA)</option>
            <option value="tbc">TBC (ACTIVE)</option>
            <option value="galt">GALT (MARGIN)</option>
            <option value="total">მთლიანი პორტფელი (Total Portfolio)</option>
          </select>
        </div>
        <div id="manual-progress-box">
          <label>მიმდინარე თანხა ($)</label>
          <input id="f-current" type="number" min="0" value="0">
        </div>
      </div>
      
      <button class="cab-btn" id="f-add">დამატება</button>
    </div>
  </details>
</main>

<footer>
  © 2026 The Trading Paper · ლაშა ფხაკაძე · ვისბადენი<br>ეს არ არის ფინანსური რჩევა
</footer>

<script src="js/cabinet.data.js?t=1"></script>
<script>document.write('<scr'+'ipt src="/portfolio-data.js?t='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>document.write('<scr'+'ipt src="js/portfolios.data.js?t='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>document.write('<scr'+'ipt src="js/portfolios.js?t='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>
(function(){
  var DATA = { goals: [] };
  
  // Load from localStorage, fallback to empty array
  try {
    var saved = localStorage.getItem('tp_goals');
    if (saved) {
      DATA.goals = JSON.parse(saved);
    } else {
      DATA.goals = [];
    }
  } catch (e) {
    DATA.goals = [];
  }

  function saveData() {
    try {
      localStorage.setItem('tp_goals', JSON.stringify(DATA.goals));
    } catch(e) {}
  }

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function getPortfolioValue(key) {
    if (typeof portfolios === 'undefined' || typeof aggregate === 'undefined') return 0;
    if (key === 'total') {
      var bog = aggregate(portfolios.bog).currentValue;
      var tbc = aggregate(portfolios.tbc).currentValue;
      var galt = aggregate(portfolios.galt).currentValue;
      return bog + tbc + galt;
    }
    var p = portfolios[key];
    if (!p) return 0;
    return aggregate(p).currentValue;
  }

  window.toggleManualProgress = function() {
    var pSelect = document.getElementById('f-portfolio');
    var pBox = document.getElementById('manual-progress-box');
    if (pSelect && pBox) {
      if (pSelect.value === 'none') {
        pBox.style.display = 'block';
      } else {
        pBox.style.display = 'none';
      }
    }
  }

  window.deleteGoal = function(id) {
    if (!confirm('ნამდვილად გსურთ ამ მიზნის წაშლა?')) return;
    DATA.goals = DATA.goals.filter(function(x) { return x.id !== id; });
    saveData();
    render();
  };

  function render(){
    var grid=document.getElementById('goal-grid'), g=DATA.goals;
    document.getElementById('goal-count').textContent=g.length+' მიზანი';
    if(!g.length){grid.innerHTML='<div class="cab-empty" style="grid-column:1/-1;">ჯერ არაფერია — დაამატე პირველი მიზანი ქვემოთ.</div>';return;}
    grid.innerHTML=g.map(function(x){
      var currentVal = 0;
      var detailSuffix = '';
      if (x.portfolio && x.portfolio !== 'none') {
        currentVal = getPortfolioValue(x.portfolio);
        var labelMap = { bog: 'BOG', tbc: 'TBC', galt: 'GALT', total: 'მთლიანი პორტფელი' };
        detailSuffix = ' (მიბმულია: ' + labelMap[x.portfolio] + ')';
      } else {
        currentVal = +x.current || 0;
      }
      
      var targetVal = +x.target || 1;
      var p = Math.max(0, Math.min(100, (currentVal / targetVal) * 100));
      var dl = x.deadline?('ვადა: '+esc(x.deadline)):'';
      var isDone = x.done || (p >= 100);
      
      var currentStr = '$' + currentVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var targetStr = '$' + targetVal.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

      return '<div class="goal'+(isDone?' done':'')+'">'
        +'<button class="goal-del-btn" onclick="deleteGoal('+x.id+')" title="წაშლა">×</button>'
        +'<div class="g-title">'+esc(x.title)+(isDone?' ✓':'')+'</div>'
        +'<div class="g-detail">'+esc(x.detail || '') + '<span style="color:var(--accent); font-weight:700;">' + detailSuffix + '</span></div>'
        +'<div style="font-size:11px; margin-bottom:8px; font-family:ui-monospace,monospace; font-weight:700;">'
        +  '<span style="color:var(--green);">' + currentStr + '</span> / <span style="color:var(--muted);">' + targetStr + '</span>'
        +'</div>'
        +'<div class="g-bar"><div class="g-fill" style="width:'+p+'%"></div></div>'
        +'<div class="g-foot"><span>'+dl+'</span><span class="g-pct">'+p.toFixed(1)+'%</span></div>'
        +'</div>';
    }).join('');
  }

  document.getElementById('f-add').addEventListener('click',function(){
    var title=document.getElementById('f-title').value.trim();
    var target = +document.getElementById('f-target').value || 0;
    if(!title){document.getElementById('f-title').focus();return;}
    if(target <= 0){document.getElementById('f-target').focus();return;}
    
    var portfolio = document.getElementById('f-portfolio').value;
    var currentVal = 0;
    if (portfolio === 'none') {
      currentVal = +document.getElementById('f-current').value || 0;
    }

    DATA.goals.push({
      id: Date.now(),
      title: title,
      detail: document.getElementById('f-detail').value.trim(),
      target: target,
      portfolio: portfolio,
      current: currentVal,
      deadline: document.getElementById('f-deadline').value,
      done: false
    });
    
    saveData();
    render();
    
    document.getElementById('f-title').value='';
    document.getElementById('f-detail').value='';
    document.getElementById('f-target').value='';
    document.getElementById('f-portfolio').value='none';
    document.getElementById('f-current').value='0';
    document.getElementById('f-deadline').value='';
    toggleManualProgress();
    
    document.querySelector('.cab-form').removeAttribute('open');
  });

  // Check portfolios load before initial render
  function init() {
    if (typeof portfolios === 'undefined' || typeof aggregate === 'undefined') {
      setTimeout(init, 100);
      return;
    }
    render();
  }
  
  init();
})();
</script>
<script src="js/masthead.js?v=6"></script>
<script src="js/clocks.js?v=1"></script>
</body>
</html>
