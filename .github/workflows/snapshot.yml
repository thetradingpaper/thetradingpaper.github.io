name: Daily portfolio snapshot

# Records one dated point (deposited + live value per book) into
# data/history.json after the US market closes, so the mountain
# charts grow every day, AND refreshes data/prices.json — the quote
# cache the live site falls back to when the public CORS proxies fail.
# Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: '30 14,17,20 * * 1-5'  # ~10:30/13:30/16:30 ET, Mon-Fri — keep prices.json fresh through the US session
    - cron: '45 21 * * 1-5'        # 21:45 UTC — the daily history.json point (~1-2h after US close)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build snapshot
        run: node scripts/snapshot.js
      - name: Commit if changed
        run: |
          git config user.name "thetradingpaper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/prices.json
          if git diff --cached --quiet; then
            echo "No change today."
          else
            git commit -m "Daily snapshot $(date -u +%F)"
            git push
          fi
