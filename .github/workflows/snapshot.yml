name: Price snapshot

on:
  push:
    paths:
      - 'js/portfolios.data.js'
      - '.github/workflows/snapshot.yml'
  schedule:
    # every 20 min during US pre-market -> after-hours, Mon-Fri (UTC)
    - cron: '3,23,43 8-23 * * 1-5'
    # one daily run on Saturday to close out the week
    - cron: '23 8 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch prices & update history
        run: node scripts/snapshot.js

      - name: Commit & push if changed
        run: |
          git config user.name "ttp-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: price snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
