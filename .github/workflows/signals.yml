name: Bot signals

on:
  schedule:
    # every 30 min during US market hours incl. pre/post edge, Mon-Fri (UTC)
    - cron: '7,37 13-21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run signal engine
        run: node scripts/signals.js
      - name: Commit & push if changed
        run: |
          git config user.name "ttp-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "bot: signals $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
