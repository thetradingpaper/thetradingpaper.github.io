<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const ticker = urlParams.get('ticker');
    let target = "/research.html?tab=evaluator";
    if (ticker) {
      target += "&ticker=" + encodeURIComponent(ticker);
    }
    window.location.replace(target);
  </script>
</head>
<body>
  <p>Redirecting to <a href="/research.html?tab=evaluator">Research Desk</a>...</p>
</body>
</html>
