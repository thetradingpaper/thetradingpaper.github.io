<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=/research.html?tab=evaluator">
  <script>
    (function(){
      var q = new URLSearchParams(window.location.search);
      var t = q.get('ticker');
      window.location.replace("/research.html?tab=evaluator" + (t ? "&ticker=" + encodeURIComponent(t) : ""));
    })();
  </script>
</head>
<body>

</body>
</html>
